version: '3.8'

services:
  treasure-hunt:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: treasure-hunt-app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=treasure_hunt_prod_secret_jwt_key_2026
      - ADMIN_DEFAULT_USERNAME=admin
      - ADMIN_DEFAULT_PASSWORD=adminpassword123
      - CLIENT_ORIGIN=*
    volumes:
      - ./data:/app/server/prisma
      - ./uploads:/app/uploads
